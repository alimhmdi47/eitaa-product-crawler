# version: '3.8'

services:
  # --- Database: Redis ---
  redis:
    image: redis:7.2-alpine
    container_name: eitaa_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - eitaa_network

  redis-insight:
    image: redislabs/redisinsight:latest
    container_name: redis_insight
    restart: always
    network_mode: host 
    logging:
      driver: "json-file"
      options:
        max-size: "10m"

  # --- Database: MongoDB ---
  mongodb:
    image: mongo:latest
    container_name: eitaa_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password123
    networks:
      - eitaa_network

  mongo-express:
      image: mongo-express:latest
      container_name: mongo_ui
      restart: always
      ports:
        - "8081:8081"
      environment:
        - ME_CONFIG_MONGODB_SERVER=eitaa_mongo
        - ME_CONFIG_MONGODB_PORT=27017
        - ME_CONFIG_MONGODB_ADMINUSERNAME=admin
        - ME_CONFIG_MONGODB_ADMINPASSWORD=password123
        - ME_CONFIG_BASICAUTH_USERNAME=admin
        - ME_CONFIG_BASICAUTH_PASSWORD=pass
      depends_on:
        - mongodb
      networks:
        - eitaa_network

networks:
  eitaa_network:
    driver: bridge

volumes:
  redis_data:
  mongo_data: